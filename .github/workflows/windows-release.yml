name: Windows release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "electron/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - "next.config.ts"
      - ".github/workflows/windows-release.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable Windows app
        run: npm run windows:release

      - name: Copy artifact into releases/
        run: copy electron\dist\VaultApp-2.0-windows-portable-x64.exe releases\VaultApp-2.0-windows-portable-x64.exe

      - name: Commit Windows release binary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/VaultApp-2.0-windows-portable-x64.exe
          git diff --staged --quiet || git commit -m "Update Windows portable release [skip ci]"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: VaultApp-2.0-windows-portable-x64
          path: releases/VaultApp-2.0-windows-portable-x64.exe
